<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-generator">
        <h1 class="text-title">Random Color Generator</h1>
    </header>
    <div class="main-container">
        <section class="section-generator">
            <div class="section-color" id="colorBox">
                <div class="hex-color" id="hexCode">#FFFFFF</div>
            </div>

            <div class="section-button">
                <button type="button" class="new-color-btn" id="generateBtn">Generate new color</button>
            </div>

            <div class="copy-message" id="copyMessage">Copied!</div>
        </section>

        <footer class="short-comment">
            <div class="text-comment">Click on the HEX code to copy!</div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
