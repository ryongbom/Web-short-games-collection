<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-section">
        <h1 class="title-app">Counter App</h1>
    </header>
    <div class="main-container">
        <section class="count-section">
            <div class="number-count" id="countNum"></div>
        </section>
        <section class="buttons-section">
            <button type="button" class="increase-btn" id="increaseBtn">Increase</button>
            <button type="button" class="reset-btn" id="resetBtn">Reset</button>
            <button type="button" class="decrease-btn" id="decreaseBtn">Decrease</button>
        </section>
    </div>
    <footer class="information-section">
        <p>With HTML CSS & JS</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
