<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DIGITAL CLOCK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-clock">
        <h1 class="text-title-clock">Web DIGITAL CLOCK</h1>
    </header>

    <div class="main-section">
        <section class="clock-section">
            <div class="title-clock-section">Clock</div>
            <div class="clock-display">
                <div class="clock-hours">00</div>
                <span class="colon">:</span>
                <div class="clock-minutes">00</div>
                <span class="colon">:</span>
                <div class="clock-seconds">00</div>
            </div>

            <div class="current-date">
                
            </div>
            
        </section>

        <section class="stopwatch-section">
            <div class="title-stopwatch-section">StopWatch</div>
            <div class="stopwatch-display">
                <div class="stopwatch-hours">00</div>
                <span class="colon">:</span>
                <div class="stopwatch-minutes">00</div>
                <span class="colon">:</span>
                <div class="stopwatch-seconds">00</div>
                <span class="colon-point">.</span>
                <div class="stopwatch-mseconds">00</div>
            </div>
            <div class="buttons-section">
                <button type="button" class="start-btn">Start</button>
                <button type="button" class="stop-btn">Stop</button>
                <button type="button" class="lap-btn">Laps</button>
                <button type="button" class="reset-btn">Reset</button>
            </div>

            <div class="laps-section">

            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
